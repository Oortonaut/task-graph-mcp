# Task Graph MCP Server Configuration
# 
# This file contains default configuration values.
# Override by creating config.yaml in:
#   - task-graph/config.yaml (project-level)
#   - ~/.task-graph/config.yaml (user-level)
#
# Environment variables take highest precedence:
#   TASK_GRAPH_DB_PATH, TASK_GRAPH_MEDIA_DIR, TASK_GRAPH_LOG_DIR, TASK_GRAPH_SKILLS_DIR

server:
  # Default workflow name (e.g., "solo", "swarm", "relay", "hierarchical")
  # Uses workflow-{name}.yaml as the base workflow configuration.
  # Solo is recommended for single-agent use.
  default_workflow: "solo"
  
  # Path to SQLite database file
  db_path: "task-graph/tasks.db"
  
  # Path to media directory for file attachments
  media_dir: "task-graph/media"
  
  # Path to skills directory for custom skills
  skills_dir: "task-graph/skills"
  
  # Path to log directory
  log_dir: "task-graph/logs"
  
  # Maximum tasks an agent can claim simultaneously
  claim_limit: 5
  
  # Seconds before a claim is considered stale (15 minutes)
  stale_timeout_seconds: 900
  
  # Default output format: json or markdown
  default_format: markdown
  
  # UI configuration
  ui:
    # UI mode: none (MCP only) or web (enable dashboard)
    mode: none
    # Port for web dashboard
    port: 31994

# Path handling configuration
paths:
  # Root directory for sandboxing (default: ".")
  # All file operations are restricted to paths within this directory
  root: "."
  
  # Path style: relative or project_prefixed
  style: relative
  
  # Auto-map single-letter Windows drives (default: false)
  # When true, paths like "c:path/to/file" are treated as Windows drive paths
  map_windows_drives: false
  
  # Prefix mappings (prefix -> path)
  # Values can be: literal path, $ENV_VAR, or ${config.path}
  # Example mappings:
  #   home: "$HOME"
  #   project: "."
  #   media: "${server.media_dir}"
  mappings: {}

# Dependency type configuration
dependencies:
  definitions:
    blocks:
      display: horizontal
      blocks: start
    follows:
      display: horizontal
      blocks: start
    contains:
      display: vertical
      blocks: completion
    duplicate:
      display: horizontal
      blocks: none
    see-also:
      display: horizontal
      blocks: none
    relates-to:
      display: horizontal
      blocks: none

# Auto-advance configuration
auto_advance:
  enabled: false
  target_state: null

# Agent feedback configuration
feedback:
  # Enable give_feedback and list_feedback tools (default: true)
  enabled: true
  # Maximum feedback file size in bytes (default: 1048576 = 1MB, 0 = unlimited)
  max_size_bytes: 1048576

# Tag definitions
tags:
  # Behavior for unknown tags: allow, warn, reject
  unknown_tag: warn

  definitions:
    # Hierarchy level tags (used by governance overlay)
    level:vision:
      category: hierarchy
      description: "Multi-quarter north-star objective"
    level:initiative:
      category: hierarchy
      description: "Quarter-length strategic bet"
    level:epic:
      category: hierarchy
      description: "Multi-sprint body of work (2-6 weeks)"
    level:story:
      category: hierarchy
      description: "Sprint-sized deliverable"
    level:task:
      category: hierarchy
      description: "1-3 day concrete work item"
    level:subtask:
      category: hierarchy
      description: "Hours-scale atomic unit of work"
    level:step:
      category: hierarchy
      description: "Minutes-scale micro-step (automation)"

    # Work domain tags (used by governance overlay)
    domain:engineering:
      category: domain
      description: "Software engineering work"
    domain:legal:
      category: domain
      description: "Legal, compliance, and contract work"
    domain:finance:
      category: domain
      description: "Budget, procurement, and financial work"
    domain:hr:
      category: domain
      description: "Personnel, hiring, and organizational work"
    domain:security:
      category: domain
      description: "Security review, audit, and compliance"
    domain:ops:
      category: domain
      description: "Infrastructure, deployment, and operations"

# Attachment key definitions
attachments:
  # Behavior for unknown keys: allow, warn, reject
  unknown_key: warn
  
  definitions:
    commit:
      mime: "text/git.hash"
      mode: append
    checkin:
      mime: "text/p4.changelist"
      mode: append
    meta:
      mime: "application/json"
      mode: replace
    note:
      mime: "text/plain"
      mode: append
    log:
      mime: "text/plain"
      mode: append
    error:
      mime: "text/plain"
      mode: append
    output:
      mime: "text/plain"
      mode: append
    diff:
      mime: "text/x-diff"
      mode: append
    changelist:
      mime: "text/plain"
      mode: append
    plan:
      mime: "text/markdown"
      mode: replace
    result:
      mime: "application/json"
      mode: replace
    context:
      mime: "text/plain"
      mode: replace
    # Gate attachments - for workflow gate satisfaction
    gate/tests:
      mime: "text/plain"
      mode: append
      # For attaching test results or explanation of why tests pass/fail
    gate/commit:
      mime: "text/plain"
      mode: append
      # For attaching commit hash or reason for no commit
    gate/review:
      mime: "text/plain"
      mode: append
      # For attaching review notes or approval
    # Governance overlay gate attachments
    gate/business-approval:
      mime: "text/plain"
      mode: append
      # For attaching stakeholder/executive approval
    gate/budget-review:
      mime: "text/plain"
      mode: append
      # For attaching budget impact review
    gate/budget-approval:
      mime: "text/plain"
      mode: append
      # For attaching finance sign-off
    gate/design-review:
      mime: "text/plain"
      mode: append
      # For attaching design review notes
    gate/acceptance-criteria:
      mime: "text/plain"
      mode: append
      # For attaching acceptance criteria verification
    gate/legal-sign-off:
      mime: "text/plain"
      mode: append
      # For attaching legal counsel approval
    gate/security-review:
      mime: "text/plain"
      mode: append
      # For attaching security review findings
    gate/patch:
      mime: "text/plain"
      mode: append
      # For attaching patch submission confirmation (gate satisfaction)
    patch:
      mime: "text/x-diff"
      mode: append
      # For attaching actual patch content (git format-patch or git diff output)

