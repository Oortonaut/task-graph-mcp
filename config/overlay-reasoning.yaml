name: reasoning
description: "Reasoning capture: instructs agents to document thought processes, decisions, and alternatives as task attachments for auditability and knowledge transfer."

states:
  working:
    prompts:
      enter: >
        IMMEDIATELY after claiming this task, record your initial analysis by running:

        attach(task="{{task_id}}", type="reasoning", name="initial-analysis", content="""
        ## Problem Understanding
        [Restate the problem in your own words — what exactly needs to change and why]

        ## Key Assumptions
        [List assumptions you are making about scope, environment, or requirements]

        ## Planned Approach
        [Describe the approach you will take and why you chose it over alternatives]
        """)

        Do this BEFORE writing any code. As you work, record significant decisions
        with additional attach() calls using type="reasoning" and name="decision-log".
      exit: >
        STOP — before transitioning out of working state, you MUST do both of the following:

        1. Attach a reasoning summary of the work you did:

           attach(task="{{task_id}}", type="reasoning", name="decision-log", content="""
           ## Decisions Made
           [List each significant decision and its rationale]

           ## Alternatives Considered
           [For each decision, what alternatives did you reject and why]

           ## Uncertainties and Risks
           [Anything you are unsure about or that could cause problems later]
           """)

        2. Write commit messages that explain WHY, not just WHAT. Use this format:

           First line: imperative summary of what changed
           Blank line
           Body: WHY this approach was chosen over alternatives
           Footer: Task: {{task_id}}

        Do NOT transition until you have attached at least one reasoning document.
        Check with: attachments(task="{{task_id}}") — verify a type="reasoning" entry exists.

  completed:
    prompts:
      enter: >
        REQUIRED before this task can be considered done — run this attach() call now:

        attach(task="{{task_id}}", type="reasoning", name="completion-summary", content="""
        ## Summary
        [What was accomplished — be specific about files changed and why]

        ## Key Decisions
        [Major choices made and rationale for each]

        ## Alternatives Rejected
        [Options considered but not taken, with concrete reasoning for rejection]

        ## Learnings
        [Insights that could help future tasks in this codebase]
        """)

        Then satisfy the reasoning gate:
        attach(task="{{task_id}}", type="gate/reasoning", content="Reasoning documented — see completion-summary attachment")

  failed:
    prompts:
      enter: >
        REQUIRED — attach a failure analysis NOW so the next agent or retry has context:

        attach(task="{{task_id}}", type="reasoning", name="failure-analysis", content="""
        ## What Was Attempted
        [Concrete steps taken, in order]

        ## Why It Failed
        [Root cause or blocking issue — be specific, not 'it didn't work']

        ## Reasoning Gap
        [What assumption was wrong or what information was missing]

        ## Recommended Next Steps
        [Specific actions the next attempt should take differently]
        """)

        Then satisfy the failure reasoning gate:
        attach(task="{{task_id}}", type="gate/failure-reasoning", content="Failure analysis documented — see failure-analysis attachment")

gates:
  status:completed:
    - type: gate/reasoning
      enforcement: warn
      description: >
        Attach reasoning documentation before completing. Good reasoning attachments include:
        problem understanding, key decisions with rationale, alternatives considered,
        and learnings. Use attach(task=id, type="reasoning", content="...").

    - type: gate/reasoning-in-commits
      enforcement: warn
      description: >
        Commit messages should explain WHY, not just WHAT. Include:
        - Rationale for the approach taken
        - Key alternatives considered (if non-obvious)
        - Task ID reference for full reasoning trail
        The commit history is a permanent reasoning record—make it useful.

  status:failed:
    - type: gate/failure-reasoning
      enforcement: warn
      description: >
        Attach failure analysis explaining what was attempted, why it failed,
        and what reasoning gap led to the failure.

# Attachment conventions for this overlay:
# - type: "reasoning" - for all reasoning documents
# - name suggestions:
#   - "initial-analysis" - first understanding of the problem
#   - "decision-log" - ongoing decision record
#   - "completion-summary" - final reasoning summary
#   - "failure-analysis" - post-mortem on failed tasks
#   - "alternatives" - detailed comparison of rejected approaches

# Commit message conventions:
# - First line: imperative summary of WHAT changed
# - Blank line
# - Body: WHY this approach (rationale, constraints, tradeoffs)
# - Alternatives considered (especially if non-obvious choice)
# - Task ID reference: "Task: <id>" for linking to full reasoning
#
# The two reasoning channels serve different purposes:
# - Attachments: detailed, structured, searchable within task-graph
# - Commits: permanent Git history, visible in blame/log, travels with code
